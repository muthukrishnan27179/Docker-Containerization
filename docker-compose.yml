# ==============================================================================
# Production Docker Compose Specification
# Architecture: Nginx (Reverse Proxy) -> Web (Flask/Gunicorn) -> Postgres + Redis
# Demonstrates: Multi-stage builds, custom bridge networks, named persistent volumes,
# healthchecks, and decoupled tier isolation.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy / Ingress Tier (Nginx)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: reverse-proxy
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. Application Tier (Python Flask + Gunicorn WSGI)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: web-app
    ports:
      # Optional direct access to application port
      - "5000:5000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - PORT=5000
      - HOST=0.0.0.0
      - SECRET_KEY=dev-secret-key-docker-project-2026
      # Database Connection Parameters (Resolved via Docker DNS)
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=taskdb
      # Cache Connection Parameters (Resolved via Docker DNS)
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - CACHE_ENABLED=true
      - CACHE_TTL=30
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network
    volumes:
      # Local storage mount fallback
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Database Tier (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskdb
    volumes:
      # Named volume for database data persistence
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. Cache & In-Memory Store Tier (Redis 7)
  # ----------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: redis-cache
    command: ["redis-server", "--appendonly", "yes"] # Enable AOF persistence
    volumes:
      # Named volume for Redis append-only file persistence
      - redis_data:/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

# ------------------------------------------------------------------------------
# Volumes Definition (Persistent Storage)
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local

# ------------------------------------------------------------------------------
# Networks Definition (Segmented Microservices Communication)
# ------------------------------------------------------------------------------
networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
