# ==============================================================================
# Development Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ==============================================================================
services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    environment:
      - APP_ENV=development
      - DEBUG=true
    volumes:
      - ./app:/app
    ports:
      - "5000:5000"

  db:
    ports:
      - "5432:5432"

  cache:
    ports:
      - "6379:6379"
